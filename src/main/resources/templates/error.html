<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="he" dir="rtl">
<head th:replace="~{fragments/layout :: head('TRUE - שגיאה')}"></head>
<body class="bg-light">
<nav th:replace="~{fragments/layout :: navbar('')}"></nav>
<main class="container py-5 text-center">
    <div class="card border-0 shadow-sm mx-auto" style="max-width:520px">
        <div class="card-body p-5">
            <i class="bi bi-exclamation-triangle text-warning" style="font-size:3rem"></i>
            <h1 class="h3 fw-bold mt-3" th:text="${status} ?: 'שגיאה'">500</h1>
            <p class="text-muted" th:text="${error} ?: 'אירעה שגיאה בלתי צפויה.'">שגיאה</p>
            <a th:href="@{/feed}" class="btn btn-navy fw-bold mt-2">חזרה לפיד</a>
        </div>
    </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
