<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="he" dir="rtl">

<!-- ============================================================
     Shared layout fragments: head, navbar, footer
     ============================================================ -->

<head th:fragment="head(pageTitle)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle}">TRUE Community</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.rtl.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/theme.css}">
</head>

<body>

<!-- NAVBAR: pass the active page key, e.g. ~{fragments/layout :: navbar('feed')} -->
<nav th:fragment="navbar(active)" class="navbar navbar-expand-lg bg-white border-bottom sticky-top shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/feed}">TR<span class="brand-accent">U</span>E
            <span class="fw-normal text-muted small">Community</span></a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav"
                aria-controls="mainNav" aria-expanded="false" aria-label="תפריט">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="mainNav">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${active == 'feed'} ? 'active fw-bold text-navy'"
                       th:href="@{/feed}">פיד גילוי</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${active == 'leaderboard'} ? 'active fw-bold text-navy'"
                       th:href="@{/leaderboard}">לוח המובילים</a>
                </li>
                <!-- visible only when logged in -->
                <li class="nav-item" sec:authorize="isAuthenticated()">
                    <a class="nav-link" th:classappend="${active == 'dashboard'} ? 'active fw-bold text-navy'"
                       th:href="@{/dashboard}">האזור שלי</a>
                </li>
                <!-- visible only to editors -->
                <li class="nav-item" sec:authorize="hasRole('EDITOR')">
                    <a class="nav-link" th:classappend="${active == 'editor'} ? 'active fw-bold text-navy'"
                       th:href="@{/editor}">שולחן העורך</a>
                </li>
                <li class="nav-item" sec:authorize="hasRole('EDITOR')">
                    <a class="nav-link" th:classappend="${active == 'admin-speakers'} ? 'active fw-bold text-navy'"
                       th:href="@{/admin/speakers}">דוברים</a>
                </li>
                <li class="nav-item" sec:authorize="hasRole('EDITOR')">
                    <a class="nav-link" th:classappend="${active == 'admin-users'} ? 'active fw-bold text-navy'"
                       th:href="@{/admin/users}">משתמשים</a>
                </li>
                <li class="nav-item" sec:authorize="hasRole('EDITOR')">
                    <a class="nav-link" th:classappend="${active == 'admin-statements'} ? 'active fw-bold text-navy'"
                       th:href="@{/admin/statements}">אמירות</a>
                </li>
            </ul>

            <div class="d-flex align-items-center gap-2">
                <!-- anonymous -->
                <a sec:authorize="isAnonymous()" class="btn btn-outline-secondary btn-sm" th:href="@{/login}">התחברות</a>
                <a sec:authorize="isAnonymous()" class="btn btn-navy btn-sm" th:href="@{/register}">הרשמה</a>

                <!-- authenticated: profile link + logout -->
                <a sec:authorize="isAuthenticated()" th:href="@{/dashboard}"
                   class="text-decoration-none text-muted small" title="האזור שלי">
                    <i class="bi bi-person-circle"></i>
                    <span sec:authentication="name">user</span>
                </a>
                <form sec:authorize="isAuthenticated()" th:action="@{/logout}" method="post" class="m-0">
                    <button type="submit" class="btn btn-outline-secondary btn-sm">התנתקות</button>
                </form>
            </div>
        </div>
    </div>
</nav>

<!-- FOOTER -->
<footer th:fragment="footer" class="border-top mt-5 py-4 bg-white">
    <div class="container text-center text-muted small">
        <span class="fw-bold text-navy">TRUE Community</span> · פלטפורמת אימות עובדות קהילתית
    </div>
</footer>

<!-- SCRIPTS -->
<th:block th:fragment="scripts">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
    document.addEventListener('DOMContentLoaded', function () {
        document.querySelectorAll('.needs-validation').forEach(function (form) {
            form.addEventListener('submit', function (event) {
                if (!form.checkValidity()) {
                    event.preventDefault();
                    event.stopPropagation();
                }
                form.classList.add('was-validated');
            });
        });
    });
    </script>
</th:block>

</body>
</html>
