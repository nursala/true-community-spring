<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="he" dir="rtl">
<head th:replace="~{fragments/layout :: head('TRUE · הרשמה')}"></head>
<body class="bg-light">

<nav th:replace="~{fragments/layout :: navbar('')}"></nav>

<main class="container py-5">
    <div class="row justify-content-center">
        <div class="col-12 col-sm-9 col-md-6 col-lg-5">
            <div class="card border-0 shadow-sm">
                <div class="card-body p-4">
                    <h1 class="h4 fw-bold text-center mb-4">הרשמה ל-TRUE Community</h1>

                    <form th:action="@{/register}" th:object="${registerForm}" method="post" class="needs-validation" novalidate>

                        <div class="mb-3">
                            <label for="username" class="form-label fw-bold small">שם משתמש</label>
                            <input type="text" id="username" class="form-control" th:field="*{username}"
                                   th:classappend="${#fields.hasErrors('username')} ? 'is-invalid'">
                            <div th:if="${#fields.hasErrors('username')}" th:errors="*{username}" class="invalid-feedback d-block"></div>
                            <div class="form-text">3–50 תווים.</div>
                        </div>

                        <div class="mb-3">
                            <label for="email" class="form-label fw-bold small">אימייל</label>
                            <input type="email" id="email" class="form-control" th:field="*{email}"
                                   th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'">
                            <div th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="invalid-feedback d-block"></div>
                        </div>

                        <div class="mb-3">
                            <label for="password" class="form-label fw-bold small">סיסמה</label>
                            <input type="password" id="password" class="form-control" th:field="*{password}"
                                   th:classappend="${#fields.hasErrors('password')} ? 'is-invalid'">
                            <div th:if="${#fields.hasErrors('password')}" th:errors="*{password}" class="invalid-feedback d-block"></div>
                            <div class="form-text">לפחות 6 תווים.</div>
                        </div>

                        <div class="mb-3">
                            <label for="confirmPassword" class="form-label fw-bold small">אימות סיסמה</label>
                            <input type="password" id="confirmPassword" class="form-control" th:field="*{confirmPassword}"
                                   th:classappend="${#fields.hasErrors('confirmPassword')} ? 'is-invalid'">
                            <div th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}" class="invalid-feedback d-block"></div>
                        </div>

                        <button type="submit" class="btn btn-navy w-100 fw-bold">צור חשבון</button>
                    </form>

                    <p class="text-center text-muted small mt-4 mb-0">
                        כבר רשומים? <a th:href="@{/login}" class="text-navy fw-bold">התחברות</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
